<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador CSS — Semana 4</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header><p class="eyebrow">DESDE HTML HASTA BOOTSTRAP · TOMO II</p><h1>Simulador de fondos y efectos</h1><p>Modifica los controles y observa el resultado. El CSS se genera automáticamente.</p></header>
<div class="layout"><section class="controls" aria-label="Controles del simulador">
<label>Color inicial <input id="color1" type="color" value="#2563eb"></label>
<label>Color final <input id="color2" type="color" value="#9333ea"></label>
<label>Tipo de fondo <select id="tipo"><option value="linear">Degradado lineal</option><option value="radial">Degradado radial</option><option value="solid">Color sólido</option></select></label>
<label>Ángulo <input id="angulo" type="range" min="0" max="360" value="120"><output id="anguloOut">120°</output></label>
<label>Radio de borde <input id="radio" type="range" min="0" max="60" value="16"><output id="radioOut">16px</output></label>
<label>Desenfoque <input id="blur" type="range" min="0" max="8" value="0" step="1"><output id="blurOut">0px</output></label>
<label>Opacidad <input id="opacidad" type="range" min="30" max="100" value="100"><output id="opacidadOut">100%</output></label>
<label>Intensidad de sombra <input id="sombra" type="range" min="0" max="40" value="18"><output id="sombraOut">18px</output></label>
<div class="buttons"><button id="reset" type="button">Restablecer</button><button id="copy" type="button">Copiar CSS</button></div><p id="status" role="status" aria-live="polite"></p>
</section><section class="stage"><h2>Vista previa</h2><div id="preview" class="preview"><div class="sample"><strong>Tu tarjeta CSS</strong><p>Los cambios se reflejan aquí en tiempo real.</p></div></div><h2>CSS generado</h2><pre><code id="cssOutput"></code></pre></section></div>
<footer><a href="../../index.html">Volver al índice del paquete</a></footer></main><script src="script.js"></script></body></html>
