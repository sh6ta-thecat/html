<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador CSS — Semana 5</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><p class="eyebrow">DESDE HTML HASTA BOOTSTRAP · TOMO II</p><h1>Simulador del modelo de caja</h1><p>Ajusta el ancho, alto, padding, borde, margen y box-sizing.</p></header>
<div class="layout"><section class="controls" aria-label="Controles del modelo de caja">
<label>Ancho del contenido <input id="ancho" type="range" min="100" max="420" value="240"><output id="anchoOut">240px</output></label>
<label>Alto del contenido <input id="alto" type="range" min="60" max="240" value="120"><output id="altoOut">120px</output></label>
<label>Padding <input id="padding" type="range" min="0" max="50" value="20"><output id="paddingOut">20px</output></label>
<label>Borde <input id="borde" type="range" min="0" max="20" value="4"><output id="bordeOut">4px</output></label>
<label>Margen <input id="margen" type="range" min="0" max="50" value="16"><output id="margenOut">16px</output></label>
<label>Modelo de caja <select id="modelo"><option value="content-box">content-box</option><option value="border-box">border-box</option></select></label>
<div class="buttons"><button id="reset" type="button">Restablecer</button><button id="copy" type="button">Copiar CSS</button></div><p id="status" role="status" aria-live="polite"></p></section>
<section class="stage"><h2>Vista previa</h2><div class="ruler"><div id="box" class="box"><strong>Contenido</strong><p>Padding dentro del borde</p></div></div><div class="metrics"><p>Ancho exterior aproximado: <strong id="totalW">288px</strong></p><p>Alto exterior aproximado: <strong id="totalH">168px</strong></p></div><h2>CSS generado</h2><pre><code id="cssOutput"></code></pre></section></div>
<footer><a href="../../index.html">Volver al índice del paquete</a></footer></main><script src="script.js"></script></body></html>
